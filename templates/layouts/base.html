{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Materio Clone{% endblock %}
    </title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">


    <link rel="stylesheet" href="{% static 'css/layout.css' %}">
    <link rel="stylesheet" href="{% static 'css/sidebar.css' %}">
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'css/sales.css' %}">
    <link rel="stylesheet" href="{% static 'css/invoice.css' %}">

</head>


<body>


<div class="app-layout">


    <div class="sidebar-header">
        ERP System
    </div>


    {% include 'includes/navbar.html' %}


    {% include 'includes/sidebar.html' %}


    <main class="main-content">

        {% block content %}

        {% endblock %}

    </main>


</div>



<!-- Activity Panel -->

<div id="activityPanel" class="activity-panel">

    <div class="activity-header">

        <h3>
            Activity Log
        </h3>


        <button 
            class="close-btn"
            onclick="closeActivity()"
        >
            ✕
        </button>

    </div>


    <div class="activity-content">

        <div class="activity-item">

            Invoice created

            <small>
                Today
            </small>
        </div>
        <div class="activity-item">
            Payment received
            <small>
                Yesterday
            </small>
        </div>
    </div>
</div>

<div id="overlay" onclick="closeActivity()"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>


<script>

document.addEventListener("DOMContentLoaded", function(){

    // Sidebar dropdown
    document.querySelectorAll(".submenu-toggle").forEach(function(toggle){
        toggle.addEventListener("click", function(){
            this.parentElement.classList.toggle("open");
        });
    });
    // Options dropdown
    const optionsBtn = document.querySelector(".options-btn");
    const optionsMenu = document.querySelector(".options-menu");
    if(optionsBtn && optionsMenu){
        optionsBtn.addEventListener("click", function(event){
            event.stopPropagation();
            optionsMenu.classList.toggle("show");
        });
        document.addEventListener("click", function(){
            optionsMenu.classList.remove("show");
        });
    }
});

// Activity panel

function openActivity(){
    document.getElementById("activityPanel").classList.add("active");
    document.getElementById("overlay").classList.add("active");
}

function closeActivity(){
    document.getElementById("activityPanel").classList.remove("active");
    document.getElementById("overlay").classList.remove("active");}



</script>


</body>

</html>
