<!-- Product/Service Creation Modal -->
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/invoice_add.css' %}">
<link rel="stylesheet" href="{% static 'css/sales_add.css' %}">
{% endblock %}

{% block extra_js %}
<!-- <script src="{% static 'js/sales_add.js' %}"></script> -->
<script src="{% static 'js/sharedinvoice_add.js' %}"></script>
{% endblock %}
<div class="modal-overlay" id="productModalOverlay" style="display: none;">
    <div class="modal-card">
        <div class="modal-header">
            <h3>New Product/Service</h3>
            <button type="button" class="modal-close-btn" onclick="closeProductModal()">×</button>
        </div>

        <div class="modal-body">
            <form id="newProductForm">
                <div class="modal-form-group">
                    <label>Type of Product <span>*</span></label>
                    <div class="product-type-toggle">
                        <button type="button" class="type-btn active" id="typeGoodsBtn"
                            onclick="setProductType('Goods')">Goods</button>
                        <button type="button" class="type-btn" id="typeServicesBtn"
                            onclick="setProductType('Services')">Services</button>
                    </div>
                    <input type="hidden" name="product_type" id="productTypeValue" value="Goods">
                </div>

                <div class="modal-form-group">
                    <label>Name <span>*</span></label>
                    <input type="text" name="product_name" placeholder="Name" required>
                </div>

                <div class="modal-grid-2">
                    <div class="modal-form-group">
                        <label>Code</label>
                        <input type="text" name="product_code" value="P0001" readonly class="input-readonly">
                    </div>

                    <div class="modal-form-group category-picker-container" onclick="event.stopPropagation();">
                        <label>Category <span>*</span></label>
                        <input type="hidden" name="product_category" id="selectedCategoryId" required>

                        <div class="custom-select-trigger" onclick="toggleCategoryDropdown(event)">
                            <input type="text" id="categorySearchInput" class="modal-input-field"
                                placeholder="Category Name" readonly>
                            <span class="chevron-icon">▼</span>
                        </div>

                        <div class="custom-dropdown-popup category-popup" id="categoryDropdownPopup">
                            <div class="dropdown-options-list" id="categoryOptionsList">
                                <div class="dropdown-option-item" onclick="selectCategory('General', event)">General
                                </div>
                            </div>
                            <div class="dropdown-add-new-row" onclick="event.stopPropagation();">
                                <button type="button" class="btn-add-new" onclick="openCategoryModal(event)">+ Add
                                    New</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-grid-2">
                    <div class="modal-form-group">
                        <label>Tax</label>
                        <select name="product_tax">
                            <option value="No Vat">No Vat</option>
                            <option value="13% VAT">13% VAT</option>
                        </select>
                    </div>

                    <div class="modal-form-group unit-picker-container" onclick="event.stopPropagation();">
                        <label>Primary Unit <span>*</span></label>
                        <input type="hidden" name="primary_unit" id="selectedUnitId" required>

                        <div class="custom-select-trigger" onclick="toggleUnitDropdown(event)">
                            <input type="text" id="unitSearchInput" class="modal-input-field" placeholder="Primary Unit"
                                readonly>
                            <span class="chevron-icon">▼</span>
                        </div>

                        <!-- Upward Dropdown Card matching Location style -->
                        <div class="unit-dropdown-card" id="unitDropdownPopup">
                            <div class="dropdown-options-list" id="unitOptionsList">
                                <div class="dropdown-option-item" onclick="selectUnit('Bag', event)">Bag</div>
                                <div class="dropdown-option-item" onclick="selectUnit('Can', event)">Can</div>
                                <div class="dropdown-option-item" onclick="selectUnit('Box', event)">Box</div>
                                <div class="dropdown-option-item" onclick="selectUnit('Carton', event)">Carton</div>
                                <div class="dropdown-option-item" onclick="selectUnit('Cubic Feet', event)">Cubic Feet
                                </div>
                                <div class="dropdown-option-item" onclick="selectUnit('Kg', event)">Kg</div>
                                <div class="dropdown-option-item" onclick="selectUnit('Piece', event)">Piece</div>
                            </div>
                            <div class="dropdown-add-new-row" onclick="event.stopPropagation();">
                                <button type="button" class="btn-add-new" onclick="openUnitModal(event)">+ Add
                                    New</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-grid-2">
                    <div class="modal-form-group">
                        <label>HS Code</label>
                        <input type="text" name="hs_code" placeholder="HS Code">
                    </div>

                    <div class="modal-form-group">
                        <label>Location</label>
                        <div class="location-picker-container" onclick="event.stopPropagation();">
                            <input type="hidden" name="location" id="selectedLocationInput" value="">

                            <!-- Trigger Display Box -->
                            <div class="location-select-trigger" onclick="toggleLocationDropdown()">
                                <span id="locationDisplayLabel">Select Location</span>
                                <span class="chevron-icon">▼</span>
                            </div>

                            <!-- Scrollable Popup Card -->
                            <div class="location-dropdown-card" id="locationDropdownCard">
                                <!-- Top Right: Select All -->
                                <div class="location-dropdown-header">
                                    <button type="button" class="select-all-btn"
                                        onclick="toggleSelectAllLocations()">Select All</button>
                                </div>

                                <div class="location-options-list">
                                    <label class="location-option-item">
                                        <input type="checkbox" class="location-checkbox" value="Head Office"
                                            onchange="updateLocationSelection()">
                                        <span>Head Office</span>
                                    </label>
                                    <label class="location-option-item">
                                        <input type="checkbox" class="location-checkbox" value="POS Restaurant"
                                            onchange="updateLocationSelection()">
                                        <span>POS Restaurant</span>
                                    </label>
                                    <label class="location-option-item">
                                        <input type="checkbox" class="location-checkbox" value="POS Retail"
                                            onchange="updateLocationSelection()">
                                        <span>POS Retail</span>
                                    </label>
                                </div>

                                <div class="location-dropdown-footer">
                                    <button type="button" class="btn-apply-location"
                                        onclick="applyLocationSelection()">Apply</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-toggle-group">
                    <label class="invoice-switch">
                        <input type="checkbox" name="available_for_sale" checked>
                        <span class="invoice-slider"></span>
                    </label>
                    <strong>Available For Sale</strong>
                </div>

                <div class="modal-actions">
                    <button type="button" class="modal-save-btn" onclick="saveNewProduct()">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Category Creation Modal -->
<div class="modal-overlay nested-modal-overlay" id="categoryModalOverlay" style="display: none;">
    <div class="modal-card category-modal-card">
        <div class="modal-header">
            <h3>New Category</h3>
            <button type="button" class="modal-close-btn" onclick="closeCategoryModal()">×</button>
        </div>

        <div class="modal-body">
            <form id="newCategoryForm">
                <div class="modal-form-group">
                    <label>Name <span>*</span></label>
                    <input type="text" id="newCategoryName" name="category_name" placeholder="Name" required>
                </div>

                <div class="modal-form-group">
                    <label for="underCategorySelect">Under Category</label>
                    <select id="underCategorySelect" name="parent_category" class="category-select" required>
                        <option value="" disabled selected hidden>Select a category...</option>
                        <option value="general">General</option>
                    </select>
                </div>

                <div class="modal-form-group">
                    <label>Description</label>
                    <input type="text" name="category_description" placeholder="Description">
                </div>

                <div class="modal-actions">
                    <button type="button" class="modal-save-btn" onclick="saveNewCategory()">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Primary Unit Creation Modal -->
<div class="modal-overlay nested-modal-overlay" id="unitModalOverlay" style="display: none;">
    <div class="modal-card unit-modal-card">
        <div class="modal-header">
            <h3>New Primary Unit</h3>
            <button type="button" class="modal-close-btn" onclick="closeUnitModal()">×</button>
        </div>

        <div class="modal-body">
            <form id="newUnitForm">
                <div class="modal-form-group">
                    <label>Unit Name <span>*</span></label>
                    <input type="text" id="newUnitName" name="unit_name" placeholder="e.g. Meter, Liter" required>
                </div>

                <div class="modal-form-group">
                    <label>Short Name</label>
                    <input type="text" id="newUnitSymbol" name="unit_symbol" placeholder="e.g. m, L">
                </div>

                <div class="modal-form-group">
                    <label>Description</label>
                    <input type="text" name="unit_description" placeholder="Description">
                </div>

                <div class="modal-actions">
                    <button type="button" class="modal-save-btn" onclick="saveNewUnit()">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
