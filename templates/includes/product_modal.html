<!-- Quick Add Product / Item Modal -->
<div id="productModal" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.6); backdrop-filter:blur(4px); z-index:999999; align-items:center; justify-content:center; padding:16px;">
    <div style="background:#ffffff; width:100%; max-width:620px; border-radius:12px; box-shadow:0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1); border:1px solid #e2e8f0; overflow:hidden; animation:modalSlideUp 0.2s ease-out;">
        <!-- Modal Header -->
        <div style="padding:16px 20px; background:#f8fafc; border-bottom:1px solid #e2e8f0; display:flex; align-items:center; justify-content:space-between;">
            <div style="display:flex; align-items:center; gap:10px;">
                <div style="width:36px; height:36px; background:linear-gradient(135deg, #2563eb, #1d4ed8); color:#ffffff; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; box-shadow:0 2px 6px rgba(37,99,235,0.25);">
                    <i class="fa-solid fa-box-open"></i>
                </div>
                <div>
                    <h3 style="margin:0; font-size:15px; font-weight:700; color:#0f172a;" id="productModalTitle">Add New Product / Item</h3>
                    <p style="margin:2px 0 0 0; font-size:12px; color:#64748b;">Create a new item or service to select in your document</p>
                </div>
            </div>
            <button type="button" onclick="closeAddProductModal()" style="border:none; background:transparent; color:#94a3b8; font-size:18px; cursor:pointer; padding:4px; border-radius:6px; transition:all 0.15s; display:flex; align-items:center; justify-content:center;" onmouseover="this.style.color='#0f172a'; this.style.background='#e2e8f0'" onmouseout="this.style.color='#94a3b8'; this.style.background='transparent'">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Modal Form Body -->
        <form id="quickProductForm" onsubmit="submitQuickProductForm(event)">
            {% csrf_token %}
            <div style="padding:20px; max-height:75vh; overflow-y:auto; display:flex; flex-direction:column; gap:16px;">
                
                <!-- Error Alert Box -->
                <div id="quickProductError" style="display:none; padding:10px 14px; background:#fef2f2; border:1px solid #fecaca; border-radius:8px; color:#991b1b; font-size:12px; align-items:center; gap:8px;">
                    <i class="fa-solid fa-circle-exclamation" style="font-size:14px; flex-shrink:0;"></i>
                    <span id="quickProductErrorText"></span>
                </div>

                <!-- Basic Fields: Name & Type -->
                <div style="display:grid; grid-template-columns: 2fr 1fr; gap:12px;">
                    <div>
                        <label style="font-size:12px; font-weight:600; color:#334155; margin-bottom:4px; display:block;">Item / Product Name <span style="color:#ef4444;">*</span></label>
                        <input type="text" id="qp_name" name="name" required placeholder="e.g. Cement 50Kg or IT Consulting" class="form-control" style="width:100%; height:38px; border:1.5px solid #cbd5e1; border-radius:7px; padding:0 12px; font-size:13px; outline:none;" autofocus>
                    </div>
                    <div>
                        <label style="font-size:12px; font-weight:600; color:#334155; margin-bottom:4px; display:block;">Type <span style="color:#ef4444;">*</span></label>
                        <select id="qp_product_type" name="product_type" class="form-select" style="width:100%; height:38px; border:1.5px solid #cbd5e1; border-radius:7px; padding:0 12px; font-size:13px; outline:none; background:#fff;">
                            <option value="Goods" selected>Goods</option>
                            <option value="Service">Service</option>
                        </select>
                    </div>
                </div>

                <!-- Code, Category & Unit -->
                <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:12px;">
                    <div>
                        <label style="font-size:12px; font-weight:600; color:#334155; margin-bottom:4px; display:block;">Item Code / SKU</label>
                        <input type="text" id="qp_code" name="code" placeholder="e.g. CEM-001" class="form-control" style="width:100%; height:38px; border:1.5px solid #cbd5e1; border-radius:7px; padding:0 12px; font-size:13px; outline:none;">
                    </div>
                    <div>
                        <label style="font-size:12px; font-weight:600; color:#334155; margin-bottom:4px; display:block;">Category</label>
                        <input type="text" id="qp_category" name="category_name" placeholder="e.g. Construction Materials" list="qp_category_list" class="form-control" style="width:100%; height:38px; border:1.5px solid #cbd5e1; border-radius:7px; padding:0 12px; font-size:13px; outline:none;" autocomplete="off">
                        <datalist id="qp_category_list">
                            {% if categories %}
                                {% for cat in categories %}
                                    <option value="{{ cat.name }}">
                                {% endfor %}
                            {% endif %}
                        </datalist>
                    </div>
                    <div>
                        <label style="font-size:12px; font-weight:600; color:#334155; margin-bottom:4px; display:block;">Unit</label>
                        <select id="qp_unit" name="unit" class="form-select" style="width:100%; height:38px; border:1.5px solid #cbd5e1; border-radius:7px; padding:0 12px; font-size:13px; outline:none; background:#fff;">
                            <option value="Pcs" selected>Pcs</option>
                            <option value="Kg">Kg</option>
                            <option value="Box">Box</option>
                            <option value="Ltr">Ltr</option>
                            <option value="Bag">Bag</option>
                            <option value="Mtr">Meter</option>
                            <option value="Set">Set</option>
                            <option value="Pair">Pair</option>
                            <option value="Doz">Dozen</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <!-- Pricing & HS Code -->
                <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:12px;">
                    <div>
                        <label style="font-size:12px; font-weight:600; color:#334155; margin-bottom:4px; display:block;">Selling Price (NPR) <span style="color:#ef4444;">*</span></label>
                        <input type="number" step="0.01" id="qp_selling_price" name="selling_price" placeholder="0.00" value="0.00" required class="form-control" style="width:100%; height:38px; border:1.5px solid #cbd5e1; border-radius:7px; padding:0 12px; font-size:13px; outline:none; text-align:right;">
                    </div>
                    <div>
                        <label style="font-size:12px; font-weight:600; color:#334155; margin-bottom:4px; display:block;">Purchase Cost (NPR)</label>
                        <input type="number" step="0.01" id="qp_purchase_price" name="purchase_price" placeholder="0.00" value="0.00" class="form-control" style="width:100%; height:38px; border:1.5px solid #cbd5e1; border-radius:7px; padding:0 12px; font-size:13px; outline:none; text-align:right;">
                    </div>
                    <div>
                        <label style="font-size:12px; font-weight:600; color:#334155; margin-bottom:4px; display:block;">HS Code</label>
                        <input type="text" id="qp_hs_code" name="hs_code" placeholder="e.g. 2523.29" class="form-control" style="width:100%; height:38px; border:1.5px solid #cbd5e1; border-radius:7px; padding:0 12px; font-size:13px; outline:none; font-family:monospace;">
                    </div>
                </div>

                <!-- Description -->
                <div>
                    <label style="font-size:12px; font-weight:600; color:#334155; margin-bottom:4px; display:block;">Description / Spec</label>
                    <textarea id="qp_description" name="description" rows="2" placeholder="Item description or specifications..." class="form-control" style="width:100%; border:1.5px solid #cbd5e1; border-radius:7px; padding:8px 12px; font-size:12.5px; outline:none; resize:vertical;"></textarea>
                </div>

            </div>

            <!-- Modal Footer Buttons -->
            <div style="padding:14px 20px; background:#f8fafc; border-top:1px solid #e2e8f0; display:flex; justify-content:flex-end; gap:10px;">
                <button type="button" onclick="closeAddProductModal()" style="padding:8px 16px; border:1px solid #cbd5e1; background:#ffffff; color:#475569; border-radius:7px; font-size:13px; font-weight:600; cursor:pointer; transition:all 0.15s;">
                    Cancel
                </button>
                <button type="submit" id="btn_save_quick_product" style="padding:8px 20px; border:none; background:linear-gradient(135deg, #2563eb, #1d4ed8); color:#ffffff; border-radius:7px; font-size:13px; font-weight:600; cursor:pointer; box-shadow:0 2px 6px rgba(37,99,235,0.3); display:flex; align-items:center; gap:8px; transition:all 0.15s;">
                    <i class="fa-solid fa-check"></i> Save Product
                </button>
            </div>
        </form>
    </div>
</div>
