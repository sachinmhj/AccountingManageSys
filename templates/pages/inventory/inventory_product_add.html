{% extends "layouts/base.html" %}
{% block content %}
<div style="padding: 24px;">
    <h2>{{ title }}</h2>
    <div style="background: white; padding: 24px; border-radius: 8px; margin-top: 16px;">
        <form method="POST">
            {% csrf_token %}
            <div style="display: grid; gap: 16px;">
                {{ form.as_p }}
            </div>
            <div style="margin-top: 24px;">
                <button type="submit" style="padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Save</button>
                <button type="button" onclick="history.back()" style="padding: 8px 16px; background: #f8f9fa; border: 1px solid #ddd; border-radius: 4px; margin-left: 8px; cursor: pointer;">Cancel</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
